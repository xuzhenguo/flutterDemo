name: CI

# 触发时机：推送到 main、或向 main 提 PR 时自动跑。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取仓库代码
      - uses: actions/checkout@v4

      # 2. 安装 Flutter(稳定版)
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # 3. 拉取依赖
      - run: flutter pub get

      # 4. 静态检查(有告警/错误会让 CI 失败)
      - run: flutter analyze

      # 5. 跑测试
      - run: flutter test
